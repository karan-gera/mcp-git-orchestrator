# AI VCS Policy Configuration
# Complete configuration file for MCP Git Orchestrator

# Branch Protection
protected_branches:
  - main
  - master
  - develop
  - release/*
  - hotfix/*

# Default base branch for new features and PRs
default_base: main

# Commit Message Conventions
commit_style:
  # Enforce Conventional Commits specification
  enforce_conventional: true
  
  # Allowed commit types
  allowed_types:
    - feat        # New features
    - fix         # Bug fixes
    - docs        # Documentation changes
    - style       # Code style changes (formatting, etc.)
    - refactor    # Code refactoring
    - perf        # Performance improvements
    - test        # Adding or updating tests
    - chore       # Maintenance tasks
    - ci          # CI/CD changes
    - build       # Build system changes
    - revert      # Reverting previous commits
  
  # Require scope in commit messages (e.g., feat(auth): add login)
  require_scope: false
  
  # Maximum commit message length
  max_length: 72
  
  # Require body for certain types
  require_body_for:
    - feat
    - fix
  
  # Custom validation patterns
  patterns:
    # Require issue reference for certain types
    require_issue_ref: true
    issue_pattern: "(?:Close|Closes|Fix|Fixes|Resolve|Resolves)\\s+#\\d+"

# Branch Naming Conventions
branch_naming:
  # Allowed branch name pattern (regex)
  pattern: "^(feature|feat|bugfix|fix|hotfix|chore|docs|refactor|perf|test|ci)\/[a-z0-9-]+$"
  
  # Maximum branch name length
  max_length: 50
  
  # Examples for documentation
  examples:
    - "feature/user-authentication"
    - "fix/login-validation-error"
    - "hotfix/critical-security-patch"
    - "chore/update-dependencies"
    - "docs/api-documentation"
    - "refactor/database-layer"
    - "perf/optimize-queries"
    - "test/integration-suite"
    - "ci/github-actions-setup"

# Force Push Protection
deny_force_push: true

# Pre-push Validation Checks
prepush_checks:
  # Run tests before pushing
  - name: "npm test"
    required: true
    timeout: 300  # 5 minutes
    
  # Run linting
  - name: "npm run lint"
    required: false
    timeout: 60   # 1 minute
    
  # Type checking for TypeScript projects
  - name: "npm run type-check"
    required: true
    timeout: 120  # 2 minutes
    
  # Build verification
  - name: "npm run build"
    required: false
    timeout: 180  # 3 minutes
    
  # Security audit
  - name: "npm audit --audit-level=moderate"
    required: false
    timeout: 60

# Merge Strategy Configuration
merge_strategy: "merge"  # Options: merge, rebase, squash

# Advanced Merge Settings
merge_settings:
  # Require clean history for merges
  require_clean_history: true
  
  # Automatically delete feature branches after merge
  auto_delete_branches: true
  
  # Require up-to-date branch before merge
  require_up_to_date: true

# Safety Snapshots Configuration
safety_snapshots:
  # Automatically create stash before risky operations
  auto_stash: true
  
  # Use worktree isolation for conflict resolution
  worktree_for_conflicts: true
  
  # Keep snapshots for X days
  retention_days: 7
  
  # Maximum number of snapshots to keep
  max_snapshots: 10

# File and Directory Rules
file_rules:
  # Files that require review
  require_review:
    - "package.json"
    - "package-lock.json"
    - "*.config.js"
    - "*.config.ts"
    - "Dockerfile"
    - ".github/workflows/*"
    - "*.env.example"
  
  # Files that should not be committed
  forbidden_files:
    - "*.env"
    - "*.key"
    - "*.pem"
    - "*.p12"
    - "secrets.json"
    - ".DS_Store"
    - "Thumbs.db"
  
  # Large file warnings (in MB)
  large_file_threshold: 10

# Code Quality Rules
quality_rules:
  # Maximum lines of code per commit
  max_lines_per_commit: 500
  
  # Require tests for new features
  require_tests_for_features: true
  
  # Test file patterns
  test_patterns:
    - "*.test.ts"
    - "*.test.js"
    - "*.spec.ts"
    - "*.spec.js"
    - "__tests__/**/*"

# GitHub Integration (when GITHUB_TOKEN is available)
github:
  # Default PR template
  pr_template: |
    ## Description
    Brief description of changes
    
    ## Type of Change
    - [ ] Bug fix
    - [ ] New feature
    - [ ] Breaking change
    - [ ] Documentation update
    
    ## Testing
    - [ ] Tests pass locally
    - [ ] New tests added for features
    - [ ] Manual testing completed
    
    ## Checklist
    - [ ] Code follows style guidelines
    - [ ] Self-review completed
    - [ ] Comments added for complex logic
    - [ ] Documentation updated
  
  # Auto-assign reviewers based on files changed
  auto_reviewers:
    "src/auth/*": ["@security-team"]
    "src/api/*": ["@backend-team"]
    "src/ui/*": ["@frontend-team"]
    "*.md": ["@docs-team"]
    "package.json": ["@leads"]
  
  # Auto-assign labels based on branch or files
  auto_labels:
    "feature/*": ["enhancement"]
    "fix/*": ["bug"]
    "hotfix/*": ["hotfix", "priority-high"]
    "docs/*": ["documentation"]
    "*.test.*": ["tests"]

# Notification Settings
notifications:
  # Slack webhook for important events
  slack_webhook: ""  # Set your webhook URL
  
  # Events to notify about
  notify_on:
    - force_push_attempt
    - protected_branch_push
    - large_commit
    - failed_prepush_check
    - policy_violation

# Custom Commands
custom_commands:
  # Post-commit hooks
  post_commit:
    - "npm run format-staged"
    - "git add -u"  # Add any formatting changes
  
  # Pre-push preparation
  pre_push:
    - "npm run update-changelog"
    - "npm run generate-docs"

# Development Environment
dev_environment:
  # Required Node.js version
  node_version: ">=20.0.0"
  
  # Required tools
  required_tools:
    - "git"
    - "node"
    - "npm"
  
  # Recommended VS Code extensions
  vscode_extensions:
    - "esbenp.prettier-vscode"
    - "dbaeumer.vscode-eslint"
    - "ms-vscode.vscode-typescript-next"
    - "GitLab.gitlab-workflow"

# Policy Metadata
metadata:
  version: "1.0"
  created: "2024-01-01"
  updated: "2024-01-01"
  author: "Development Team"
  description: "Comprehensive AI VCS policy for safe Git operations"