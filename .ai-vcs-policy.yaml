# AI VCS Policy Configuration
# This file defines how AI agents should interact with this Git repository
# See: https://github.com/mcp-git-orchestrator/docs for full documentation

version: "1.0"

# Branches that require special protection (no direct pushes, require PRs)
protected_branches:
  - "main"
  - "master" 
  - "develop"
  - "production"
  - "release/*"

# Default base branch for new feature branches
default_base: "main"

# Commit message style enforcement
commit_style:
  # Enforce conventional commits format (type(scope): description)
  enforce_conventional: true
  
  # Allowed commit types
  allowed_types:
    - "feat"      # New feature
    - "fix"       # Bug fix
    - "docs"      # Documentation changes
    - "style"     # Code style changes (formatting, etc.)
    - "refactor"  # Code refactoring
    - "perf"      # Performance improvements
    - "test"      # Adding or updating tests
    - "chore"     # Maintenance tasks
    - "ci"        # CI/CD changes
    - "build"     # Build system changes
    - "revert"    # Revert previous commits
  
  # Require scope in commit messages (e.g., feat(auth): add login)
  require_scope: false
  
  # Maximum length for commit subject line
  max_subject_length: 72
  
  # Commit types that require a detailed body
  require_body_for:
    - "feat"
    - "fix"
    - "perf"
    - "refactor"
  
  # Required commit trailers (e.g., Signed-off-by, Co-authored-by)
  required_trailers: []

# Branch naming conventions
branch_naming:
  # Regex pattern for valid branch names
  pattern: "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|hotfix|release)\/[a-z0-9-]+$"
  
  # Allowed prefixes for branch names
  allowed_prefixes:
    - "feat/"
    - "fix/"
    - "docs/"
    - "style/"
    - "refactor/"
    - "perf/"
    - "test/"
    - "chore/"
    - "ci/"
    - "build/"
    - "hotfix/"
    - "release/"
  
  # Maximum branch name length
  max_length: 50
  
  # Forbidden patterns in branch names
  forbidden_patterns:
    - ".*[A-Z].*"        # No uppercase letters
    - ".*[_].*"          # No underscores
    - ".*[-]{2,}.*"      # No multiple consecutive dashes
    - "^[0-9].*"         # Cannot start with number
    - ".*[.].*"          # No dots

# Force push restrictions (strongly recommended: true)
deny_force_push: true

# Pre-push validation checks
prepush_checks:
  - name: "lint"
    command: "pnpm lint"
    required: false
    timeout: 60
    cwd: "."
  
  - name: "test"
    command: "pnpm test"
    required: false
    timeout: 300
    cwd: "."
  
  - name: "build"
    command: "pnpm build"
    required: true
    timeout: 180
    cwd: "."

# Merge strategy preferences
merge_strategy:
  # Default strategy for merging branches
  default_strategy: "merge"  # Options: merge, rebase, squash
  
  # Require pull request for protected branches
  require_pr: true
  
  # Automatically delete feature branches after successful merge
  auto_delete_merged: false
  
  # Require clean working tree before merge
  require_clean_tree: true

# Automatic safety snapshot settings
safety_snapshots:
  # Automatically create snapshots before risky operations
  auto_create: true
  
  # Snapshot method preference
  method: "stash"  # Options: stash, worktree
  
  # How long to keep snapshots (in days)
  retention_days: 7
  
  # Operations that trigger automatic snapshots
  trigger_operations:
    - "rebase"
    - "merge"
    - "reset"
    - "cherry-pick"
    - "revert"

# Repository-specific settings
repository:
  name: "mcp-git-orchestrator"
  type: "library"
  team: "ai-tools"
  
  # Respect existing Git hooks
  respect_hooks: true
  
  # Submodule handling
  submodules:
    update_strategy: "warn"  # Options: ignore, warn, auto-update
    require_confirmation: true
